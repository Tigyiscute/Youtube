<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabPlayer — Custom YouTube Queue</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-full font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">📺</span>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Chromebook Tube Player</h1>
        </div>
        <!-- Settings/Bypass Option -->
        <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-indigo-500/20 text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <label for="bypass-mode" class="cursor-pointer select-none text-slate-300">Bypass Mode (No-Cookie Domain)</label>
            <input type="checkbox" id="bypass-mode" class="rounded bg-slate-900 border-indigo-500 text-indigo-600 focus:ring-0 cursor-pointer" checked>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Left Column: Video Player and Input -->
        <div class="flex-1 flex flex-col p-6 space-y-4 overflow-y-auto">
            
            <!-- Video Player Stage -->
            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
                <!-- YouTube iframe wrapper -->
                <div id="player-container" class="absolute top-0 left-0 w-full h-full hidden">
                    <div id="player" class="w-full h-full"></div>
                </div>
                <!-- Idle State Placeholder -->
                <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 to-slate-950 text-center p-6">
                    <div class="p-4 bg-indigo-500/10 rounded-full border border-indigo-500/30 mb-4 animate-bounce">
                        <span class="text-4xl text-indigo-400">⚡</span>
                    </div>
                    <h3 class="text-lg font-semibold">No Video Playing</h3>
                    <p class="text-sm text-slate-400 max-w-sm mt-1">Paste a YouTube link or Video ID below to play it inside this tab.</p>
                </div>
            </div>

            <!-- Video Controls & Input Panel -->
            <div class="bg-slate-900/50 p-5 rounded-2xl border border-slate-800/80 backdrop-blur-md space-y-4">
                <h3 class="font-semibold text-slate-200">Load New Video</h3>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="video-input" 
                           placeholder="Paste YouTube Link or Video ID (e.g., dQw4w9WgXcQ)" 
                           class="flex-1 px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700/80 focus:border-indigo-500 focus:outline-none text-sm placeholder-slate-500 transition">
                    <div class="flex gap-2">
                        <button onclick="playNowBtn()" class="flex-1 sm:flex-none px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                            Play Now
                        </button>
                        <button onclick="addToQueueBtn()" class="flex-1 sm:flex-none px-5 py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 rounded-xl font-medium text-sm border border-slate-700 transition">
                            Add to Queue
                        </button>
                    </div>
                </div>
                <!-- Status/Meta Bar -->
                <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/60">
                    <span id="playing-title" class="font-medium text-indigo-400 truncate max-w-xs sm:max-w-md">Currently Playing: None</span>
                    <span id="autoplay-indicator" class="flex items-center gap-1.5 text-emerald-400">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                        Auto-play queue active
                    </span>
                </div>
            </div>
        </div>

        <!-- Right Column: Queue Sidebar -->
        <div class="w-full lg:w-96 bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col h-1/2 lg:h-full">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900/80 backdrop-blur-sm sticky top-0 z-10">
                <div class="flex items-center space-x-2">
                    <span class="text-indigo-400">📋</span>
                    <h2 class="font-bold text-lg text-slate-100">Your Video Queue</h2>
                    <span id="queue-count" class="bg-indigo-500/20 text-indigo-400 text-xs px-2 py-0.5 rounded-full font-semibold border border-indigo-500/20">0</span>
                </div>
                <button onclick="clearQueue()" class="text-xs text-slate-400 hover:text-red-400 transition">
                    Clear All
                </button>
            </div>

            <!-- Queue List -->
            <div id="queue-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamically populated -->
            </div>

            <div class="p-4 border-t border-slate-800 text-center text-xs text-slate-500">
                Queue is automatically saved to your Chromebook's local storage.
            </div>
        </div>
    </main>

    <!-- JavaScript Engine -->
    <script>
        // Load the YouTube Iframe Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let queue = JSON.parse(localStorage.getItem('yt_queue')) || [];
        let currentVideoId = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderQueue();
        });

        // Initialize the player placeholder state
        function onYouTubeIframeAPIReady() {
            // Keep the iframe hidden until the user decides to load a video
            document.getElementById('player-container').classList.add('hidden');
        }

        // Extracts 11-digit YouTube ID from any format URL
        function extractVideoId(url) {
            url = url.trim();
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/ ]{11})/i;
            const match = url.match(regex);
            
            if (match && match[1]) {
                return match[1];
            } else if (url.length === 11) {
                return url; // Assume plain Video ID
            }
            return null;
        }

        // Creates/Updates Player Instantiation
        function loadVideo(videoId) {
            currentVideoId = videoId;
            const bypassEnabled = document.getElementById('bypass-mode').checked;
            const hostDomain = bypassEnabled ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com';

            document.getElementById('player-placeholder').classList.add('hidden');
            document.getElementById('player-container').classList.remove('hidden');

            if (!player) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    host: hostDomain,
                    playerVars: {
                        'autoplay': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            } else {
                // If toggling "Bypass Filter" mode, rebuild the iframe with the correct domain
                const currentIframeSrc = player.getIframe().src;
                const matchExpectedHost = bypassEnabled ? currentIframeSrc.includes('youtube-nocookie.com') : (currentIframeSrc.includes('youtube.com') && !currentIframeSrc.includes('nocookie'));

                if (matchExpectedHost) {
                    player.loadVideoById(videoId);
                } else {
                    player.destroy();
                    player = null;
                    loadVideo(videoId);
                }
            }
            
            document.getElementById('playing-title').innerText = `Currently Playing: ${videoId}`;
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            updateCurrentlyPlayingTitle();
        }

        function onPlayerStateChange(event) {
            // Watch for video finished event to launch next queued video
            if (event.data === YT.PlayerState.ENDED) {
                playNext();
            }
            updateCurrentlyPlayingTitle();
        }

        function updateCurrentlyPlayingTitle() {
            if (player && player.getVideoData) {
                const data = player.getVideoData();
                if (data && data.title) {
                    document.getElementById('playing-title').innerText = `Currently Playing: ${data.title}`;
                }
            }
        }

        function playNowBtn() {
            const input = document.getElementById('video-input');
            const videoId = extractVideoId(input.value);
            if (videoId) {
                loadVideo(videoId);
                input.value = '';
            } else {
                alert('Please input a valid YouTube URL or 11-digit Video ID.');
            }
        }

        function addToQueueBtn() {
            const input = document.getElementById('video-input');
            const videoId = extractVideoId(input.value);
            if (videoId) {
                addToQueue(videoId);
                input.value = '';
            } else {
                alert('Please input a valid YouTube URL or 11-digit Video ID.');
            }
        }

        // Manage Queue Arrays
        function addToQueue(videoId) {
            const queueItem = {
                id: videoId,
                title: `Video (${videoId})`,
                timestamp: Date.now()
            };
            queue.push(queueItem);
            saveQueue();
            renderQueue();
        }

        function playFromQueue(index) {
            const item = queue[index];
            loadVideo(item.id);
            queue.splice(index, 1); // Delete from list when started
            saveQueue();
            renderQueue();
        }

        function playNext() {
            if (queue.length > 0) {
                playFromQueue(0);
            } else {
                document.getElementById('player-placeholder').classList.remove('hidden');
                document.getElementById('player-container').classList.add('hidden');
                document.getElementById('playing-title').innerText = "Currently Playing: None";
                if (player) player.stopVideo();
            }
        }

        function removeFromQueue(index) {
            queue.splice(index, 1);
            saveQueue();
            renderQueue();
        }

        function clearQueue() {
            if (confirm("Clear your playlist queue?")) {
                queue = [];
                saveQueue();
                renderQueue();
            }
        }

        function saveQueue() {
            localStorage.setItem('yt_queue', JSON.stringify(queue));
        }

        function renderQueue() {
            const listContainer = document.getElementById('queue-list');
            const countBadge = document.getElementById('queue-count');
            
            listContainer.innerHTML = '';
            countBadge.innerText = queue.length;

            if (queue.length === 0) {
                listContainer.innerHTML = `
                    <div class="h-44 flex flex-col items-center justify-center text-center text-slate-500 border-2 border-dashed border-slate-800 rounded-xl p-4">
                        <span class="text-2xl mb-1">💤</span>
                        <p class="text-xs font-semibold">Your queue is empty</p>
                        <p class="text-[10px] text-slate-600 mt-0.5">Paste links to build a playlist!</p>
                    </div>
                `;
                return;
            }

            queue.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex items-center justify-between p-3 bg-slate-850 rounded-xl border border-slate-800 hover:bg-slate-800/80 hover:border-slate-700 transition gap-2";
                
                itemDiv.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="text-xs text-slate-600 font-mono">${index + 1}</span>
                        <div class="overflow-hidden">
                            <p class="text-xs font-semibold text-slate-200 truncate cursor-pointer" onclick="playFromQueue(${index})">${item.title}</p>
                            <p class="text-[10px] text-indigo-400 font-mono">${item.id}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button onclick="playFromQueue(${index})" class="p-1.5 text-emerald-400 hover:bg-emerald-500/10 rounded-lg transition" title="Play Now">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button onclick="removeFromQueue(${index})" class="p-1.5 text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="Remove">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
